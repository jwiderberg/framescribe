[project]
name = "framescribe"
version = "0.1.0"
description = "Turn a long screen recording with spoken commentary into a Markdown evidence report (transcript, key frames, on-screen text, timeline), locally on a Mac with Apple Silicon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "framescribe contributors" }]
keywords = ["screen recording", "transcription", "speech recognition", "ocr", "macos", "apple silicon", "mlx"]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "numpy",
  "opencv-python-headless",
  "parakeet-mlx",
  "huggingface_hub>=0.24",
  "rich>=15.0.0",
  "pillow>=13.0.0",
  "pyobjc-framework-vision>=13.0",
  "pyobjc-framework-cocoa>=13.0",
]

[project.urls]
Homepage = "https://github.com/jwiderberg/framescribe"
Repository = "https://github.com/jwiderberg/framescribe"
Issues = "https://github.com/jwiderberg/framescribe/issues"

[project.scripts]
framescribe = "framescribe.cli:app"

[dependency-groups]
# pyyaml: tests/test_release.py reads the workflow. cmarkgfm: GitHub's own Markdown renderer (cmark-gfm), the tests
# render report.md and transcript.md with it
dev = ["pytest>=8", "pyyaml>=6", "cmarkgfm>=2024.11.20"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run a real ASR model (deselect with -m 'not slow')"]
